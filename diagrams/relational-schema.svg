<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .sub { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .tbl { fill: #ffffff; stroke: #9fb2d1; stroke-width: 2; rx: 16; ry: 16; }
      .head { fill: #dfe8f6; rx: 16; ry: 16; }
      .name { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .field { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .rel { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="1200"/>
  <text class="title" x="900" y="56" text-anchor="middle">EcoWatt Relational Schema</text>
  <text class="sub" x="900" y="88" text-anchor="middle">Logical data model inferred from the SQLite tables used by the app</text>

