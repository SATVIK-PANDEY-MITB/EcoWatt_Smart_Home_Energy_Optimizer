  <text class="field" x="200" y="816">channel</text>
  <text class="field" x="200" y="839">subject</text>
  <text class="field" x="200" y="862">message</text>
  <text class="field" x="200" y="885">status / created_at / sent_at / metadata</text>

  <text class="note" x="1240" y="730">Logical relationships used by queries and handlers</text>
  <text class="note" x="1240" y="752">The app does not declare foreign-key constraints explicitly</text>

